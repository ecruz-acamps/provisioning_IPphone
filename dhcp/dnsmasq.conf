# dnsmasq: entrega o servidor de provisionamento aos telefones.
# Troque 192.168.1.20 pelo IP do servidor de provisionamento.
dhcp-option=66,"192.168.1.20"

# Opcional: só para telefones Intelbras (OUI 24:fd:0d e 00:1a:3f, confira
# os primeiros 6 dígitos dos seus aparelhos):
# dhcp-mac=set:intelbras,24:fd:0d:*:*:*
# dhcp-option=tag:intelbras,66,"192.168.1.20"
