# ISC dhcpd (/etc/dhcp/dhcpd.conf), dentro do bloco "subnet" dos telefones.
# Troque 192.168.1.20 pelo IP do servidor de provisionamento.
option tftp-server-name "192.168.1.20";          # opção 66

# Alguns firmwares aceitam URL completa na opção 66:
# option tftp-server-name "http://192.168.1.20/";
