# =====================================================================
#  modelos.conf - um modelo de telefone por linha
#
#  modelo | template (em templates/) | nome do arquivo gerado | escape
#
#  Nome do arquivo gerado aceita:
#    {{mac}}  = MAC em minúsculas sem separador  (24fd0d350b0d)
#    {{MAC}}  = MAC em maiúsculas sem separador  (24FD0D350B0D)
#  escape: "xml" para templates XML (escapa & < > " '), "none" para texto.
#
#  TIP 120i/125i/125: o manual oficial de autoprovisionamento da Intelbras
#  (docs-intelbras/) mostra o aparelho pedindo <MAC EM MAIÚSCULAS>.xml
#  (ex.: 001A3F068E10.xml) e um arquivo comum opcional tip120system.xml /
#  tip125system.xml.
# =====================================================================
tip235g | tip235g.cfg | {{mac}}.cfg | none
tip125i | tip125i.xml | {{MAC}}.xml | xml
tip120i | tip120i.xml | {{MAC}}.xml | xml
tip125  | tip125.xml  | {{MAC}}.xml | xml
