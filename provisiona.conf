# =====================================================================
#  provisiona.conf - configurações gerais do servidor de provisionamento
#  Valores iniciais tirados do backup de um TIP 235G da UTFPR (out/2026).
# =====================================================================

# PABX / servidor SIP onde os ramais registram
SIP_SERVER="172.20.1.18"
SIP_PORT="5060"

# Tempo de registro SIP (segundos). Os aparelhos atuais usam 90.
SIP_REG_TTL="90"

# --- Padrão de numeração (o mesmo do script antigo) -------------------
#   create_modelo_125i.sh 24fd0d350b0d 3310 4480 DIOMAI-CT
#     usuário SIP  = PREFIXO_USUARIO + prefixo + ramal  -> 554133104480
#     senha SIP    = igual ao usuário (SENHA_PADRAO=usuario)
#     nome display = FORMATO_NOME                       -> 3310-4480 DIOMAI-CT
PREFIXO_USUARIO="5541"
# Prefixo usado quando a planilha deixar a coluna "prefixo" vazia
PREFIXO_PADRAO="3310"
# "usuario" = senha igual ao usuário SIP; qualquer outro valor = senha obrigatória
SENHA_PADRAO="usuario"
FORMATO_NOME="{{PREFIXO}}-{{RAMAL}} {{NOME}}"

# Título no display (TIP 235G)
LCD_TITULO="UTFPR"

# VLAN de voz (TIP 235G). Os aparelhos atuais usam VLAN 990 e aprendem a
# VLAN pela opção 132 do DHCP. Deixe VLAN_ID vazio para não mexer na VLAN.
VLAN_ID="990"
VLAN_DHCP_OPCAO="132"

# Servidores de hora (os mesmos dos aparelhos atuais)
NTP_SERVER="200.189.40.8"
NTP_SERVER2="200.160.0.8"

# Pasta servida por TFTP/HTTP/FTP. Os arquivos gerados vão para cá.
PROV_DIR="/srv/provisionamento"

# Planilha mestre com todos os ramais (fonte da verdade).
# "provisiona.sh regerar" recria todos os arquivos a partir dela.
# FAÇA BACKUP DESTE ARQUIVO (foi a falta dele que causou a perda anterior).
RAMAIS_CSV="/opt/provisionamento/ramais.csv"

# Senha de administrador da página web do telefone (TIP 235G).
# Deixe vazio para não alterar a senha do aparelho.
ADMIN_PASS=""
